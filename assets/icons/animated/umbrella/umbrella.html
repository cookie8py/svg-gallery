<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>비를 막아주는 우산 애니메이션</title>

    <style>
        :root {
            --umbrella-color: #427eff;
            --rain-color: #8fb3ff;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            background-color: transparent;
        }

        .umbrella-scene {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .rain-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            top: 0;
            width: 3px;
            height: 18px;
            background-color: var(--rain-color);
            border-radius: 999px;
            opacity: 0.85;
            transform-origin: center;
        }

        .umbrella-scale-box {
            position: relative;
            z-index: 2;
            flex: 0 0 auto;
            width: 220px;
            height: 240px;
            transform-origin: center;
        }

        .umbrella-graphic {
            display: block;
            width: 220px;
            height: 240px;
            overflow: visible;
        }

        .umbrella-part {
            fill: var(--umbrella-color);
        }

        .umbrella-line {
            fill: none;
            stroke: var(--umbrella-color);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>
    <div
        class="umbrella-scene"
        id="umbrellaScene"
    >
        <div
            class="rain-layer"
            id="rainLayer"
            aria-hidden="true"
        ></div>

        <div
            class="umbrella-scale-box"
            id="umbrellaScaleBox"
        >
            <svg
                class="umbrella-graphic"
                viewBox="0 0 220 240"
                role="img"
                aria-labelledby="umbrellaTitle umbrellaDescription"
            >
                <title id="umbrellaTitle">
                    비를 막아주는 우산
                </title>

                <desc id="umbrellaDescription">
                    빗방울이 우산 위에 떨어진 뒤 양옆으로 튀어 나갑니다.
                </desc>

                <!-- 꼭지를 포함한 우산대 -->
                <path
                    class="umbrella-line"
                    d="
                        M 110 10
                        L 110 210
                    "
                />

                <!-- 우산 덮개 -->
                <path
                    class="umbrella-part"
                    id="umbrellaCanopy"
                    d="
                        M 10 120

                        C 10 65,
                          55 22,
                          110 22

                        C 165 22,
                          210 65,
                          210 120

                        C 192 100,
                          161 100,
                          143.33 120

                        C 125 100,
                          95 100,
                          76.67 120

                        C 59 100,
                          28 100,
                          10 120

                        Z
                    "
                />

                <!-- 우산 손잡이 -->
                <path
                    class="umbrella-line"
                    d="
                        M 110 210
                        L 110 218

                        C 110 232,
                          135 232,
                          135 218
                    "
                />
            </svg>
        </div>
    </div>

    <script>
        window.addEventListener(
            "message",
            function (event) {
                const data = event.data;

                if (
                    !data ||
                    typeof data !== "object"
                ) {
                    return;
                }

                if (
                    data.type ===
                        "svg-gallery-colors" &&
                    data.colors
                ) {
                    Object.entries(
                        data.colors
                    ).forEach(
                        function ([key, value]) {
                            document
                                .documentElement
                                .style
                                .setProperty(
                                    key,
                                    value
                                );
                        }
                    );
                }

                if (
                    data.type ===
                    "svg-gallery-background"
                ) {
                    document
                        .body
                        .style
                        .backgroundColor =
                            data.visible
                                ? data.color
                                : "transparent";
                }
            }
        );

        const umbrellaScene =
            document.getElementById(
                "umbrellaScene"
            );

        const umbrellaScaleBox =
            document.getElementById(
                "umbrellaScaleBox"
            );

        const rainLayer =
            document.getElementById(
                "rainLayer"
            );

        const umbrellaCanopy =
            document.getElementById(
                "umbrellaCanopy"
            );

        const umbrellaOriginalWidth = 220;
        const umbrellaOriginalHeight = 240;

        const horizontalSpace = 20;
        const verticalSpace = 20;

        const rainInterval = 120;

        function resizeUmbrella() {
            const availableWidth =
                Math.max(
                    umbrellaScene.clientWidth -
                        horizontalSpace,
                    0
                );

            const availableHeight =
                Math.max(
                    umbrellaScene.clientHeight -
                        verticalSpace,
                    0
                );

            const widthScale =
                availableWidth /
                umbrellaOriginalWidth;

            const heightScale =
                availableHeight /
                umbrellaOriginalHeight;

            const scale =
                Math.max(
                    Math.min(
                        widthScale,
                        heightScale,
                        1
                    ),
                    0
                );

            umbrellaScaleBox.style.transform =
                `scale(${scale})`;
        }

        function getCanopyImpactY(
            horizontalDistance,
            canopyHalfWidth
        ) {
            const normalizedDistance =
                Math.abs(
                    horizontalDistance
                ) /
                canopyHalfWidth;

            const limitedDistance =
                Math.min(
                    normalizedDistance,
                    1
                );

            return (
                2 +
                Math.pow(
                    limitedDistance,
                    1.7
                ) *
                    88
            );
        }

        function createRaindrop() {
            const sceneRect =
                umbrellaScene
                    .getBoundingClientRect();

            const canopyRect =
                umbrellaCanopy
                    .getBoundingClientRect();

            if (
                sceneRect.width <= 0 ||
                sceneRect.height <= 0 ||
                canopyRect.width <= 0 ||
                canopyRect.height <= 0
            ) {
                return;
            }

            const canopyCenterX =
                canopyRect.left -
                sceneRect.left +
                canopyRect.width / 2;

            const canopyHalfWidth =
                canopyRect.width / 2;

            const horizontalDistance =
                Math.random() *
                    canopyRect.width -
                canopyHalfWidth;

            const impactX =
                canopyCenterX +
                horizontalDistance;

            const canopyImpactOffsetY =
                getCanopyImpactY(
                    horizontalDistance,
                    canopyHalfWidth
                );

            const impactY =
                canopyRect.top -
                sceneRect.top +
                canopyImpactOffsetY;

            const drop =
                document.createElement(
                    "div"
                );

            drop.className = "raindrop";

            drop.style.left =
                `${impactX}px`;

            rainLayer.appendChild(drop);

            const bounceDirection =
                horizontalDistance < 0
                    ? -1
                    : 1;

            const bounceDistance =
                35 +
                Math.random() *
                    45;

            const fallDistance =
                impactY - 20;

            const animationDuration =
                900 +
                Math.random() *
                    350;

            const animation =
                drop.animate(
                    [
                        {
                            transform:
                                "translate(-50%, -30px)",
                            width: "3px",
                            height: "18px",
                            borderRadius:
                                "999px",
                            opacity: 0,
                            offset: 0
                        },
                        {
                            transform:
                                "translate(-50%, 0)",
                            width: "3px",
                            height: "18px",
                            borderRadius:
                                "999px",
                            opacity: 0.85,
                            offset: 0.08
                        },
                        {
                            transform:
                                `translate(
                                    -50%,
                                    ${fallDistance}px
                                )`,
                            width: "3px",
                            height: "18px",
                            borderRadius:
                                "999px",
                            opacity: 0.85,
                            offset: 0.719
                        },
                        {
                            transform:
                                `translate(
                                    -50%,
                                    ${fallDistance}px
                                )`,
                            width: "7px",
                            height: "7px",
                            borderRadius:
                                "50%",
                            opacity: 0.9,
                            offset: 0.72
                        },
                        {
                            transform:
                                `translate(
                                    calc(
                                        -50% +
                                        ${
                                            bounceDirection *
                                            bounceDistance
                                        }px
                                    ),
                                    ${
                                        fallDistance +
                                        24
                                    }px
                                )`,
                            width: "7px",
                            height: "7px",
                            borderRadius:
                                "50%",
                            opacity: 0.8,
                            offset: 0.84
                        },
                        {
                            transform:
                                `translate(
                                    calc(
                                        -50% +
                                        ${
                                            bounceDirection *
                                            (
                                                bounceDistance +
                                                35
                                            )
                                        }px
                                    ),
                                    ${
                                        fallDistance +
                                        70
                                    }px
                                )`,
                            width: "5px",
                            height: "5px",
                            borderRadius:
                                "50%",
                            opacity: 0,
                            offset: 1
                        }
                    ],
                    {
                        duration:
                            animationDuration,
                        easing: "linear",
                        fill: "forwards"
                    }
                );

            animation.addEventListener(
                "finish",
                function () {
                    drop.remove();
                }
            );
        }

        const umbrellaResizeObserver =
            new ResizeObserver(
                resizeUmbrella
            );

        umbrellaResizeObserver.observe(
            umbrellaScene
        );

        resizeUmbrella();

        setInterval(
            createRaindrop,
            rainInterval
        );
    </script>
</body>
</html>
