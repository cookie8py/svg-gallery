<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 220 240"
    role="img"
    aria-labelledby="umbrellaTitle umbrellaDescription"
>
    <title id="umbrellaTitle">
        비를 막아주는 우산
    </title>

    <desc id="umbrellaDescription">
        우산만 보여주는 정적 썸네일
    </desc>

    <style>
        :root {
