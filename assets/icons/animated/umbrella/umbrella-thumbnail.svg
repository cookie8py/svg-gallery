            d="
                M 10 120

                C 10 65,
                  55 22,
                  110 22

                C 165 22,
                  210 65,
                  210 120

                C 192 100,
                  161 100,
                  143.33 120

                C 125 100,
                  95 100,
                  76.67 120

                C 59 100,
                  28 100,
                  10 120

                Z
            "
        />

        <path
            class="umbrella-line"
            d="
                M 110 210
                L 110 218

                C 110 232,
                  135 232,
                  135 218
            "
        />
    </g>
</svg>
