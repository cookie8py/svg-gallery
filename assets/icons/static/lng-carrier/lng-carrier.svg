    <title id="lng-carrier-title">
        LNG 운반선
    </title>

    <desc id="lng-carrier-description">
        네 개의 구형 저장 탱크가 갑판 위로 드러난 모스형 LNG 운반선
    </desc>

    <style>
        :root {
            --lng-hull: #427eff;
            --lng-tanks: #ffffff;
            --lng-bridge: #cccccc;
            --lng-mast: #b3b3b3;
            --lng-outline: #000000;
        }

        #fore-mast {
            fill: var(--lng-mast);
            stroke: var(--lng-outline);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-opacity: 0.933333;
        }

        #tank-access-system {
            fill: none;
            stroke: var(--lng-outline);
            stroke-width: 4;
            stroke-linecap: butt;
            stroke-linejoin: round;
        }

        #cargo-tanks {
            fill: var(--lng-tanks);
            stroke: var(--lng-outline);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #bridge {
            fill: var(--lng-bridge);
            stroke: var(--lng-outline);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #bridge-windows {
            fill: var(--lng-outline);
            stroke: none;
        }

        #hull {
            fill: var(--lng-hull);
            stroke: var(--lng-outline);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>

