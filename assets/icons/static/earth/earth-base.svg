    </desc>

    <style>
        :root {
            --earth-ocean: #427eff;
            --earth-land: #72c66b;
            --earth-outline: #ffffff;
        }

        #earth-ocean {
            fill: var(--earth-ocean);
        }

        #earth-continents {
            fill: var(--earth-land);
            stroke: var(--earth-outline);
        }

        #earth-outline {
            fill: none;
            stroke: var(--earth-outline);
        }
    </style>

